<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5: Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Auto-Responsive Image Gallery</h1>
    
    <!-- Lưới hiển thị ảnh -->
    <div class="gallery">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=1" alt="Ảnh ngẫu nhiên 1">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=2" alt="Ảnh ngẫu nhiên 2">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=3" alt="Ảnh ngẫu nhiên 3">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=4" alt="Ảnh ngẫu nhiên 4">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=5" alt="Ảnh ngẫu nhiên 5">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=6" alt="Ảnh ngẫu nhiên 6">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=7" alt="Ảnh ngẫu nhiên 7">
        <img class="gallery-item" src="https://picsum.photos/500/500?random=8" alt="Ảnh ngẫu nhiên 8">
    </div>
</body>
</html>
