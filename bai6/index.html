<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6: Mobile-First Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact-container">
        <h2 class="contact-title">Liên hệ với chúng tôi</h2>
        <p class="contact-subtitle">Vui lòng điền thông tin để được hỗ trợ nhanh nhất.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name" class="form-label">Họ và tên</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Nguyễn Văn A" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="ví dụ: email@domain.com" required>
            </div>
            
            <div class="form-group">
                <label for="message" class="form-label">Nội dung</label>
                <textarea id="message" name="message" class="form-textarea" placeholder="Bạn muốn nhắn gửi điều gì tới chúng tôi?" required></textarea>
            </div>
            
            <button type="submit" class="form-submit">Gửi tin nhắn</button>
        </form>
    </div>
</body>
</html>
