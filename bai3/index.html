<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3: Smart Navigation Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">BRAND.</div>
        
        <!-- Nút hiển thị trên mobile -->
        <button class="menu-toggle" aria-label="Mở menu">
            &#9776; Menu
        </button>
        
        <!-- Danh sách liên kết hiển thị trên desktop -->
        <nav class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Về chúng tôi</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <main class="content">
        <h1>Smart Navigation Bar</h1>
        <p>Thu nhỏ màn hình xuống dưới 768px để thấy các liên kết menu bị ẩn đi và nút "Menu" (Hamburger) hiện ra.</p>
        <p>Mở rộng màn hình trên 768px để thấy nút Menu biến mất và thay thế bằng danh sách liên kết nằm ngang đầy đủ.</p>
    </main>
</body>
</html>
